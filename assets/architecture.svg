<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .box{fill:#161b22;stroke-width:2;rx:14}
      .t{fill:#e6edf3;font-size:15px;font-weight:700;text-anchor:middle}
      .s{fill:#8b949e;font-size:11.5px;text-anchor:middle}
      .flow{fill:none;stroke-width:2.5;stroke-dasharray:8 8;animation:dash 1.2s linear infinite}
      .side{fill:none;stroke:#30363d;stroke-width:2;stroke-dasharray:4 6;animation:dash 2s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-32}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1100" height="460" rx="18" fill="url(#bg)"/>
  <text x="550" y="38" class="t" style="font-size:19px">Nightly data journey — from ERP to the CEO's morning dashboard</text>

  <!-- paths -->
  <path id="p1" d="M170 200 H245" class="flow" stroke="#a24bdb"/>
  <path id="p2" d="M415 200 H490" class="flow" stroke="#2ea44f"/>
  <path id="p3" d="M660 200 H735" class="flow" stroke="#00e599"/>
  <path id="p4" d="M905 200 H960" class="flow" stroke="#f2c811"/>
  <path d="M820 330 V250" class="flow" stroke="#21a366"/>
  <path d="M330 255 V320" class="side"/>

  <!-- moving packets -->
  <g filter="url(#glow)">
    <circle r="5" fill="#a24bdb"><animateMotion dur="1.6s" repeatCount="indefinite" path="M170 200 H245"/></circle>
    <circle r="5" fill="#2ea44f"><animateMotion dur="1.6s" begin=".4s" repeatCount="indefinite" path="M415 200 H490"/></circle>
    <circle r="5" fill="#00e599"><animateMotion dur="1.6s" begin=".8s" repeatCount="indefinite" path="M660 200 H735"/></circle>
    <circle r="5" fill="#f2c811"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" path="M905 200 H960"/></circle>
    <circle r="5" fill="#21a366"><animateMotion dur="1.8s" repeatCount="indefinite" path="M820 330 V250"/></circle>
  </g>

  <!-- 1 Odoo -->
  <rect x="20" y="145" width="150" height="110" class="box" stroke="#a24bdb"/>
  <text x="95" y="182" class="t">Odoo ERP</text>
  <text x="95" y="204" class="s">2 companies</text>
  <text x="95" y="220" class="s">Sales · POS · Stock</text>
  <text x="95" y="236" class="s">Purchase · Accounting</text>
  <text x="207" y="190" class="s">API</text>

  <!-- 2 ETL -->
  <rect x="245" y="145" width="170" height="110" class="box" stroke="#2ea44f"/>
  <text x="330" y="176" class="t">Custom Python ETL</text>
  <text x="330" y="198" class="s">GitHub Actions · nightly</text>
  <text x="330" y="214" class="s">39 Odoo models</text>
  <text x="330" y="230" class="s">smart incremental sync</text>
  <text x="330" y="246" class="s">retries · self-logging</text>

  <!-- 3 Neon -->
  <rect x="490" y="145" width="170" height="110" class="box" stroke="#00e599"/>
  <text x="575" y="176" class="t">PostgreSQL (Neon)</text>
  <text x="575" y="198" class="s">cloud data warehouse</text>
  <text x="575" y="214" class="s">26 business-ready views</text>
  <text x="575" y="230" class="s">7 dimensions · 19 facts</text>
  <text x="575" y="246" class="s">monthly stock history</text>

  <!-- 4 Semantic model -->
  <rect x="735" y="135" width="170" height="125" class="box" stroke="#f2c811"/>
  <text x="820" y="166" class="t">Power BI</text>
  <text x="820" y="184" class="t">Semantic Model</text>
  <text x="820" y="204" class="s">47 tables · 106 relationships</text>
  <text x="820" y="220" class="s">267 measures / 29 folders</text>
  <text x="820" y="236" class="s">one source of truth</text>

  <!-- 5 Reports -->
  <rect x="960" y="95" width="125" height="215" class="box" stroke="#f2c811"/>
  <text x="1022" y="122" class="t">6 Dept. Reports</text>
  <text x="1022" y="148" class="s">Executive</text>
  <text x="1022" y="170" class="s">Finance</text>
  <text x="1022" y="192" class="s">Inventory</text>
  <text x="1022" y="214" class="s">Purchase</text>
  <text x="1022" y="236" class="s">B2B Sales</text>
  <text x="1022" y="258" class="s">B2C / Showrooms</text>
  <text x="1022" y="290" class="s" style="fill:#f2c811">22 report pages</text>

  <!-- Excel -->
  <rect x="735" y="330" width="170" height="80" class="box" stroke="#21a366"/>
  <text x="820" y="360" class="t">OneDrive Excel</text>
  <text x="820" y="380" class="s">targets · budgets</text>
  <text x="820" y="396" class="s">business-owned mappings</text>

  <!-- Monitoring -->
  <rect x="245" y="320" width="170" height="90" class="box" stroke="#30363d"/>
  <text x="330" y="350" class="t" style="fill:#ff7b72">Watchdog</text>
  <text x="330" y="370" class="s">failure &amp; schema-change emails</text>
  <text x="330" y="386" class="s">"didn't run" detection</text>
  <circle cx="395" cy="338" r="6" fill="#3fb950" class="pulse"/>

  <text x="550" y="445" class="s" style="font-size:13px">🌙 Syncs overnight  →  ☀️ every report shows data up to last night by morning</text>
</svg>
