<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0d1117"/><stop offset=".55" stop-color="#3b1f5c"/><stop offset="1" stop-color="#7a5a00"/></linearGradient>
<linearGradient id="w" x1="0" x2="1"><stop offset="0" stop-color="#a24bdb" stop-opacity=".55"/><stop offset="1" stop-color="#f2c811" stop-opacity=".55"/></linearGradient>
<style>.tg{fill:#f2c811;font:600 21px 'Fira Code',Consolas,monospace;text-anchor:middle;opacity:0;animation:tg 12.8s infinite;transform-box:fill-box}
@keyframes tg{0%{opacity:0;transform:translateY(8px)}3%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}25%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}
.bar{animation:grow 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}@keyframes grow{from{transform:scaleY(.45)}to{transform:scaleY(1)}}</style></defs>
<rect width="1200" height="270" fill="url(#g)"/>
<path fill="url(#w)" opacity=".7"><animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 225 C200 195 400 255 600 228 C800 200 1000 252 1200 222 V270 H0Z;M0 232 C200 258 400 200 600 232 C800 262 1000 205 1200 236 V270 H0Z;M0 225 C200 195 400 255 600 228 C800 200 1000 252 1200 222 V270 H0Z"/></path>
<path fill="#0d1117" opacity=".55"><animate attributeName="d" dur="12s" repeatCount="indefinite" values="M0 248 C300 232 600 268 900 246 C1050 236 1150 250 1200 244 V270 H0Z;M0 252 C300 266 600 236 900 256 C1050 266 1150 246 1200 252 V270 H0Z;M0 248 C300 232 600 268 900 246 C1050 236 1150 250 1200 244 V270 H0Z"/></path>
<g transform="translate(70,62)"><rect class="bar" x="0" y="40" width="16" height="40" rx="2" fill="#f2c811"/><rect class="bar" x="22" y="18" width="16" height="62" rx="2" fill="#f2c811" style="animation-delay:.4s"/><rect class="bar" x="44" y="0" width="16" height="80" rx="2" fill="#f2c811" style="animation-delay:.8s"/></g>
<g transform="translate(1066,62)" opacity=".9"><circle cx="32" cy="40" r="30" fill="none" stroke="#a24bdb" stroke-width="9"/><circle cx="32" cy="40" r="30" fill="none" stroke="#f2c811" stroke-width="9" stroke-dasharray="60 129"><animateTransform attributeName="transform" type="rotate" from="0 32 40" to="360 32 40" dur="6s" repeatCount="indefinite"/></circle></g>
<text x="600" y="98" text-anchor="middle" fill="#fff" font-size="54" font-weight="700">Odoo <tspan fill="#f2c811">→</tspan> Power BI</text>
<text x="600" y="144" text-anchor="middle" fill="#c9d1d9" font-size="21">Automated Business Intelligence for a Multi-Branch Retail &amp; Wholesale Group</text>
<text x="600" y="176" text-anchor="middle" fill="#8b949e" font-size="15" letter-spacing="2">CASE STUDY · ABDUL SAMI</text>
<text x="600" y="214" class="tg" style="animation-delay:0.0s">No more manual Excel reports.</text><text x="600" y="214" class="tg" style="animation-delay:3.2s">Every department. One version of the truth.</text><text x="600" y="214" class="tg" style="animation-delay:6.4s">Fresh numbers every morning — automatically.</text><text x="600" y="214" class="tg" style="animation-delay:9.600000000000001s">Built on top of your existing Odoo.</text></svg>