*{box-sizing:border-box;margin:0}
body{background:#1b1f27;font-family:'Barlow','Noto Sans Arabic',sans-serif;color:#252423}
.top{max-width:1420px;margin:0 auto;padding:18px 12px 10px;color:#e6edf3;display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:22px;font-weight:600}.top p{color:#8b949e;font-size:13px}
#nav{max-width:1420px;margin:0 auto 10px;padding:0 12px;display:flex;gap:6px;flex-wrap:wrap}
#nav button{background:#262c36;border:1px solid #30363d;color:#c9d1d9;padding:7px 14px;border-radius:8px;cursor:pointer;font:500 14px Barlow;text-align:left}
#nav button small{display:block;font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.06em}
#nav button.on{background:#F2C811;color:#111;border-color:#F2C811}#nav button.on small{color:#5a4a00}
#wrap{max-width:1420px;margin:0 auto;overflow:hidden}
#stage{width:1420px;height:800px;background:#fff;transform-origin:0 0;display:flex;flex-direction:column;padding:6px 10px 10px;border-radius:6px}
.foot{text-align:center;color:#8b949e;font-size:12px;padding:14px}.foot a{color:#F2C811}
body.shot{background:#fff}body.shot .top,body.shot #nav,body.shot .foot{display:none}body.shot #stage{border-radius:0}
.head{display:flex;align-items:center;gap:16px;height:64px;border-bottom:2px solid #c8c8c8;background:#ececec;margin:-6px -10px 8px;padding:0 14px}
.title{font:600 27px 'Barlow Semi Condensed';min-width:290px}
.tog{display:flex;gap:6px}.tog button{border:1px solid #1d3d6b;background:#fff;color:#3b4ec2;border-radius:7px;padding:9px 22px;font:500 13px Barlow;cursor:pointer}
.tog button.on{background:#0d2c54;color:#fff;font-weight:600}
.tbtn{border:1px solid #888;border-radius:6px;padding:8px 18px;font:600 16px Barlow;color:#0d2c54;background:#fff}.tbtn.big{font-size:22px;padding:6px 40px}
.slicers{display:flex;gap:8px;margin-left:auto}.slicers.left{margin-left:0}
.sl{background:#fff;padding:4px 8px;font-size:13px;width:118px}.sl span{display:block;font-weight:500;margin-bottom:2px}.slicers.left .sl{width:160px}
.dd{border:1px solid #bbb;padding:3px 6px;color:#555;font-size:13px;display:flex;justify-content:space-between}
.row.kpis{display:flex;gap:14px;height:104px;margin-bottom:10px;align-items:stretch}
.kpi{background:#005A9E;border:2px solid #0a3a6b;border-radius:4px;flex:1;color:#cfe8ff;text-align:center;padding:10px 6px;box-shadow:0 1px 3px #0003}
.kpi.wide{flex:2}.kpi.tall{flex:1.2}.gap{width:40px}
.kt{font:600 15px Barlow;color:#e8f2ff}.kv{font:600 40px 'Barlow Semi Condensed';color:#c8e6ff;margin-top:6px}.kv.s{font-size:32px}
.trio{display:flex;justify-content:space-around;height:100%}.trio>div{flex:1}
.minis{display:flex;gap:8px;background:#e6e6e6;padding:8px;border-radius:8px}
.mini{background:#fff;border-radius:8px;width:124px;text-align:center;padding:8px 4px}.kt2{font-size:12px}.mv{font:500 18px Barlow;margin:7px 0}
.md{display:flex;justify-content:space-around;font:600 14px Barlow}
.g{color:#18b04a}.rd{color:#d64550}.am{color:#c79a00}
.grid{flex:1;display:grid;gap:10px;min-height:0}
.card{background:#ebebeb;border-radius:22px;padding:10px 14px;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.card h4{font:600 14px Barlow;margin-bottom:2px}.sub{font-size:12px;color:#666}.card canvas{flex:1;min-height:0}
.scroll{flex:1;overflow-y:auto;min-height:0}
.tm{flex-direction:row;padding:10px;gap:3px}.tm div{color:#fff;padding:10px;display:flex;flex-direction:column;justify-content:space-between}.tm b{font:700 24px 'Noto Sans Arabic'}.tm i{font:600 20px Barlow;font-style:normal}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
th{text-align:left;font-weight:500;padding:5px 7px;border-bottom:1px solid #bbb;white-space:nowrap}
td{padding:4px 7px;white-space:nowrap;font-family:'Noto Sans Arabic','Barlow';border-bottom:1px solid #eee}
td:not(:first-child),th:not(:first-child){text-align:right}
tbody tr:nth-child(even){background:#f4f4f4}
tfoot td{font-weight:700;border-top:2px solid #333}
.mx td{white-space:normal;vertical-align:top;padding:3px 7px}.mx td:nth-child(-n+2){text-align:left}
</style></head><body>
